name: Desktop builds

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Dremio-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Dremio-windows-x64
          path: Dremio-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: tool/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Dremio-macos-apple-silicon
          path: build/Dremio-macos.zip
